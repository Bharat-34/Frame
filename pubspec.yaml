name: frame
description: Frame, a local photo and video gallery.
publish_to: 'none'
version: 0.1.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  share_plus: ^13.3.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
